# Alembic: dono do schema do banco. Ver scripts/migrate.py (é o que roda em produção, via GitHub Actions).
# A URL vem do ambiente (DATABASE_URL_UNPOOLED, senão DATABASE_URL), nunca deste arquivo.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
